spring:
  application:
    name: cartoes
  datasource:
    url: jdbc:mysql://mysql2:3306/banco_eurika #    url: jdbc:mysql://mysql2:3306/banco_eurika
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update  # pode ser 'none', 'update', 'create', ou 'create-drop'
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  rabbitmq:
    host: ${RABBITMQ_SERVER}
    port: 5672
    username: ${USUARIO_RABBITMQ:guest}
    password: ${SENHA_RABBITMQ:guest}

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://projeto-fila-eurika:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

mq:
  queues:
    emissao-cartoes: emissao-cartoes
    
management:
  endpoints:
    web:
      exposure:
        include: "*"
logging:
  file:
    name: ./logs/log-file.log